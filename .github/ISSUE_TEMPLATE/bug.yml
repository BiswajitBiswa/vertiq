name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Smallest code that shows it
      description: Use generated or anonymised rows only, never real customer data.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Vertiq version and Python version
